services:
  postgres:
    image: postgres:16
    container_name: erp-financiero-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp_financiero
    ports:
      - "5432:5432"
    volumes:
      - erp_financiero_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_financiero"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  erp_financiero_pgdata:
